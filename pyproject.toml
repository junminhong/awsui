[project]
name = "awsui"
version = "0.2.0"
description = "Run AI agents and CLI tools in verified project-aware AWS contexts"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [
    {name = "junminhong (jasper)"},
]
keywords = ["aws", "cli", "tui", "profile", "sso", "ai-agent", "terraform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML>=6.0.2",
    "questionary>=2.1.1,<3",
    "rich>=14.1.0",
    "rich-argparse>=1.8,<2",
    "textual>=6.1.0",
]

[project.urls]
Homepage = "https://junminhong.github.io/awsui/"
Repository = "https://github.com/junminhong/awsui"
"Bug Tracker" = "https://github.com/junminhong/awsui/issues"

[project.scripts]
awsui = "awsui.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.2",
]
